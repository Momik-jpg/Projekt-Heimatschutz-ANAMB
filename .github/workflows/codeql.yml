name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (JavaScript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          config-file: ./.github/codeql-config.yml
          languages: javascript-typescript
          # security-and-quality enthaelt u.a. die ReDoS-/polynomiale-Regex-Queries.
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        id: codeql-analysis
        uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          category: "/language:javascript-typescript"
          output: codeql-results
          upload: never
          upload-database: false

      - name: Store CodeQL SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: error
          retention-days: 14

      - name: Enforce CodeQL findings
        run: node scripts/check-codeql-sarif.js "${{ steps.codeql-analysis.outputs.sarif-output }}"
