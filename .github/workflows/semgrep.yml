name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:cb4a443d44e794bd0e088adc998c8edb450e7418d88dec8ff86888f52f27bbe3
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Verify pinned rules
        # Der Semgrep-Container nutzt BusyBox; dessen sha256sum kennt nur -c
        # (nicht die GNU-Langoption --check). -c funktioniert in BusyBox und GNU.
        run: |
          echo "709e9ec14480d1187b17a0cbfb3237b7afc1c36566c26648cff1aa8c2bf93dde  .semgrep/security-audit.yaml" | sha256sum -c
          echo "fa5888d2be3e985444cbd5a7aa64d9f98b351bdaee578076698a65996a16ddfc  .semgrep/javascript.yaml" | sha256sum -c

      # --error: bricht bei Funden ab. Parserfehler werden als echte Fehler
      # behandelt. Der lokale Snapshot benötigt weder Registry noch Login.
      - name: Run Semgrep
        run: semgrep scan --config .semgrep/security-audit.yaml --config .semgrep/javascript.yaml --error --metrics=off
