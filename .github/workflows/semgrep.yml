name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:cb4a443d44e794bd0e088adc998c8edb450e7418d88dec8ff86888f52f27bbe3
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # --error: bricht bei Funden ab. Parserfehler werden als echte Fehler
      # behandelt (kein "gruen trotz Parserfehler"). Regeln offline, kein Login.
      - name: Run Semgrep
        run: semgrep scan --config p/security-audit --config p/javascript --error --metrics=off
